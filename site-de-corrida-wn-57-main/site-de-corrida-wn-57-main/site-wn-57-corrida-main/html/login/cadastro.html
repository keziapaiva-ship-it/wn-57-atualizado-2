<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - WN57</title>

    <!-- Estilos da página (um único arquivo) -->
    <link rel="stylesheet" href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/css/cadastro.css">

    <!-- Fontes (Google Fonts) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
</head>

<body>

    <!-- =====================================================
         01. MENU (cabeçalho)
    ====================================================== -->

    <header>


        <!-- ---------- Logo ---------- -->
        <div class="logo">
            <img src="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/img/logo/logown57.png" alt="WN57">
        </div>


        <!-- ---------- Ações do usuário (direita) ---------- -->
        <div class="menu-direita">
            <!-- Idioma (PT-BR / EN) -->
            <button class="idioma-btn" id="btnIdioma" type="button" data-no-i18n>
                🌐 PT-BR
            </button>

            <!-- Ajuda -->
            <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/ajuda.html">
                Ajuda
            </a>

            <!-- Login (preenchido via JS quando o usuário está logado) -->
            <div id="usuarioArea">
                <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/login/login.html">
                    Fazer login
                </a>
            </div>

        </div>

    </header>
    <!-- /MENU -->


    <!-- =====================================================
         02. CADASTRO (formulário)
    ====================================================== -->

    <div class="container">
        <main>
            <section class="sessao">

                <form action="/enviar-dados" method="post" novalidate>

                    <!-- ---------- Título ---------- -->
                    <div class="sessao-topo">
                        <h1>Crie sua conta</h1>
                        <p>Preencha seus dados para viajar com a WN57.</p>
                    </div>

                    <!-- ---------- Login com Google ---------- -->
                    <script src="https://accounts.google.com/gsi/client" async defer></script>

                    <div class="google-area">
                        <div id="g_id_onload"
                            data-client_id="86008452356-253qos5sqh3t35olmsdkqekkp06kgrs2.apps.googleusercontent.com"
                            data-callback="handleCredentialResponse" data-auto_select="false" data-itp_support="true">
                        </div>
                        <script>
                            function handleCredentialResponse(resposta) {
                                // Decodifica o JWT do Google
                                const base64 = resposta.credential.split(".")[1]
                                    .replace(/-/g, "+")
                                    .replace(/_/g, "/");

                                const json = decodeURIComponent(
                                    atob(base64)
                                        .split("")
                                        .map((c) => "%" + c.charCodeAt(0).toString(16).padStart(2, "0"))
                                        .join("")
                                );

                                const usuario = JSON.parse(json);

                                // Guarda o usuário como "logado"
                                localStorage.setItem(
                                    "usuario",
                                    JSON.stringify({
                                        nome: usuario.name,
                                        email: usuario.email,
                                        foto: usuario.picture,
                                        origem: "google",
                                    })
                                );

                                // Redireciona para a página principal
                                window.location.href = "/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/login/login.html";
                            }
                        </script>

                        <script src="https://accounts.google.com/gsi/client" async defer></script>


                        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                            data-text="signup_with" data-shape="pill" data-width="400">
                        </div>
                    </div>

                    <div class="divisor">
                        <span>ou cadastre-se com seus dados</span>
                    </div>

                    <!-- ---------- Campos ---------- -->
                    <div class="informacoes">

                        <div class="nome">
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Ex.: Maria da Silva" required>
                        </div>

                        <div class="email">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="voce@email.com" required>
                        </div>

                        <div class="date">
                            <label for="date">Data de nascimento</label>
                            <input type="text" id="date" name="date" placeholder="dd/mm/aaaa" required>
                        </div>

                        <div class="telefone">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                        </div>

                        <div class="senha">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                        </div>

                        <div class="confirmacao-senha">
                            <label for="confirmacao-senha">Confirmar senha</label>
                            <input type="password" id="confirmacao-senha" name="confirmacao_senha"
                                placeholder="Repita a senha" required>
                        </div>

                    </div>

                    <p class="dica-senha">
                        Use 8 ou mais caracteres, com letra maiúscula, minúscula, número e símbolo.
                    </p>

                    <!-- ---------- Enviar ---------- -->
                    <button type="submit" class="btn-enviar">Criar conta</button>

                    <!-- ---------- Rodapé do formulário ---------- -->
                    <p class="termos">
                        Ao criar a conta, você concorda com os
                        <a href="#">Termos de uso</a> e a
                        <a href="#">Política de privacidade</a>.
                    </p>

                    <p class="ja-tem-conta">
                        Já tem uma conta?
                        <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/login.html">Entrar</a>
                    </p>

                </form>

            </section>
        </main>
    </div>
    <!-- /CADASTRO -->


    <!-- =====================================================
         03. SCRIPTS
    ====================================================== -->

    <!-- E-mail de boas-vindas (EmailJS) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/javascript/email-cadastro.js"></script>

    <!-- Lógica do cadastro -->
    <script src="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/javascript/cadastro.js"></script>
</body>

</html>
