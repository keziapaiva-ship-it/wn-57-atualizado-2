<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - WN57</title>

    <link rel="stylesheet"
        href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- NAV -->
    <nav>

        <div class="logo">
            <img src="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/img/Captura de tela 2026-09-08 150021.png"
                alt="WN57">
        </div>

        <ul class="nav-links">

            <li>
                <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/inicial.html">
                    Inicial
                </a>
            </li>

            <li>
                <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/solicitar.html">
                    Viajar
                </a>
            </li>

            <li>
                <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/atividade.html">
                    Atividade
                </a>
            </li>

            <li>
                <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/login.html">
                    Entrar
                </a>
            </li>

            <li>
                <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/ajuda.html">
                    Ajuda
                </a>
            </li>

        </ul>

        <button class="btn-nav" type="button"
            onclick="window.location.href='/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/cadastro.html'">
            Cadastre-se
        </button>

    </nav>


    <div class="background"></div>


    <!-- LOGIN -->
    <main class="container">

        <section class="login-box">

            <header class="login-header">

                <h1>WN57</h1>

                <p class="sub">
                    Bem-vindo de volta!
                </p>

                <p class="description">
                    Entre para continuar sua viagem
                </p>

            </header>


            <form id="loginForm" novalidate>

                <!-- EMAIL -->
                <div class="input-box">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required>

                </div>


                <!-- SENHA -->
                <div class="input-box">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="mostrarSenha"
                            class="password-toggle"
                            aria-label="Mostrar senha">

                            👁

                        </button>

                    </div>

                </div>


                <!-- OPÇÕES -->
                <div class="login-options">

                    <label class="remember">



                    </label>

                    <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/teste.html" id="esqueciSenha">
                        Esqueci minha senha
                    </a>

                </div>


                <!-- ERRO -->
                <p id="erroLogin" class="erro"></p>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="btn"
                    id="btnEntrar">

                    <span id="textoBotao">
                        Entrar
                    </span>

                </button>
                </div>

            </form>


            <!-- RODAPÉ -->
            <footer class="login-footer">

                <p class="link">

                    Não tem conta?

                    <a href="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/cadastro.html">
                        Criar conta
                    </a>

                </p>

            </footer>

        </section>

    </main>


    <!-- MOSTRAR / OCULTAR SENHA -->
    <script>

        const senha = document.getElementById("senha");
        const mostrarSenha = document.getElementById("mostrarSenha");

        mostrarSenha.addEventListener("click", function () {

            if (senha.type === "password") {

                senha.type = "text";
                mostrarSenha.textContent = "🙈";
                mostrarSenha.setAttribute("aria-label", "Ocultar senha");

            } else {

                senha.type = "password";
                mostrarSenha.textContent = "👁";
                mostrarSenha.setAttribute("aria-label", "Mostrar senha");

            }

        });

    </script>


    <!-- SEU JAVASCRIPT ATUAL -->
    <script src="/site-de-corrida-wn-57-main/site-wn-57-corrida-main/javascript/login.js"></script>

</body>

</html>
