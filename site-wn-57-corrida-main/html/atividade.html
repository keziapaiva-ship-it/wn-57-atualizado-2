<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minhas viagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --rosa-900: #4a1230;
            --rosa-700: #a81d63;
            --rosa-500: #e0338a;
           
            --rosa-100: #fdeaf3;
            --rosa-50: #fff7fb;
            --texto: #2a1220;
            --suave: #7d6272;
            --linha: #f0d6e4;
            --ok: #1f7a4d;
            --erro: #b4234a;
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            font-family: "DM Sans", system-ui, sans-serif;
            background: var(--rosa-50);
            color: var(--texto);
            line-height: 1.5
        }

        a {
            color:#fff;
            text-decoration: none
        }

        :focus-visible {
            outline: 3px solid var(--rosa-500);
            outline-offset: 2px
        }

        header {
            background: #000;
            position: sticky;
            top: 0;
            z-index: 50
        }

        .topo {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 36px
        }

        .logo img {
            height: 32px;
            display: block
        }

        nav {
            display: flex;
            gap: 28px;
            flex: 1
        }

        nav a {
            color: #fff;
            font-weight: 700;
            font-size: .95rem;
            padding: 6px 0;
            border-bottom: 2px solid transparent
        }

        nav a:hover,
        nav a[aria-current] {
            border-bottom-color: var(--rosa-500);
            color: #fff
        }

        .direita {
            display: flex;
            align-items: center;
            gap: 22px;
            color: #fff;
            font-weight: 500;
            font-size: .95rem
        }

        .direita a:hover {
            color: var(--rosa-200)
        }

        .idioma i {
            color: #38bdf8;
            margin-right: 6px
        }

        .perfil {
            position: relative
        }

        .perfil-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #3b0f26;
            border: 0;
            color: #fff;
            font: inherit;
            font-weight: 700;
            padding: 5px 12px 5px 6px;
            border-radius: 999px;
            cursor: pointer
        }

        .perfil-btn:hover {
            background: #4d142f
        }

        .perfil-btn .seta {
            font-size: .65rem;
            transition: transform .15s
        }

        .perfil-btn[aria-expanded=true] .seta {
            transform: rotate(180deg)
        }

        .foto {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #000;
            border: 1px solid #5a5a5a;
            display: grid;
            place-items: center;
            font-size: .8rem;
            font-weight: 800;
            color: var(--rosa-500);
            overflow: hidden
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .menu {
            position: absolute;
            right: 0;
            top: calc(100% + 10px);
            width: 324px;
            background: #fff;
            color: var(--texto);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
            padding: 18px 16px 14px;
            display: none
        }

        .menu.aberto {
            display: block
        }

        .menu-topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px
        }

        .menu-topo h3 {
            font-family: "DM Sans", system-ui, sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--rosa-900);
            line-height: 1.2;
            text-transform: capitalize
        }

        .nota-tag {
            display: inline-block;
            margin-top: 8px;
          
            font-size: .8rem;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 999px
        }

        .menu .foto-grande {
            width: 56px;
            height: 56px;
            flex: none;
            border-radius: 50%;
            background: #000;
            color: var(--rosa-500);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 1.1rem;
            overflow: hidden
        }

        .menu .foto-grande img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .atalhos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 16px
        }

        .atalhos a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 4px;
            background: var(--rosa-100);
            border-radius: 10px;
            font-size: .85rem;
            font-weight: 500;
            color: var(--texto)
        }

        .atalhos a:hover,
        .atalhos a.ativo {
            background: var(--rosa-200)
        }

        .atalhos i {
            font-size: 1.1rem
        }

        .lista-menu {
            margin-top: 10px;
            border-top: 4px solid var(--rosa-100);
            padding-top: 8px
        }

        .lista-menu a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 11px 12px;
            border-radius: 10px;
            font-size: .92rem;
            color: var(--texto)
        }

        .lista-menu a:hover {
            background: var(--rosa-50)
        }

        .lista-menu i {
            width: 18px;
            text-align: center;
            color: var(--rosa-700)
        }

        .sair {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: var(--rosa-50);
            color: #d4183d;
            font: inherit;
            font-weight: 700;
            cursor: pointer
        }

        .sair:hover {
            background: var(--rosa-100)
        }

        main {
            max-width: 1040px;
            margin: 0 auto;
            padding: 40px 24px 80px
        }

        h1 {
            font-family: Fraunces, Georgia, serif;
            font-size: 2.25rem;
            color: var(--rosa-900)
        }

        .sub {
            color: var(--suave);
            margin-top: 4px
        }

        .agendadas {
            margin-top: 32px;
            border-radius: 20px;
            background: linear-gradient(120deg, var(--rosa-700), var(--rosa-500));
            color: #fff;
            padding: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap
        }

        .agendadas h2 {
            font-size: 1.25rem
        }

        .agendadas p {
            opacity: .9;
            margin-top: 2px
        }

        .btn {
            display: inline-block;
            background: #fff;
            color: var(--rosa-700);
            font-weight: 700;
            padding: 12px 22px;
            border-radius: 999px;
            border: 0;
            cursor: pointer;
            font: inherit;
            font-weight: 700
        }

        .btn:hover {
            background: var(--rosa-100)
        }

        .barra {
            margin-top: 48px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 16px;
            flex-wrap: wrap
        }

        h2.sec {
            font-family: Fraunces, Georgia, serif;
            font-size: 1.5rem;
            color: var(--rosa-900)
        }

        .filtros {
            display: flex;
            gap: 8px
        }

        select {
            font: inherit;
            padding: 9px 14px;
            border: 1px solid var(--linha);
            border-radius: 999px;
            background: #fff;
            color: var(--texto);
            cursor: pointer
        }

        .lista {
            margin-top: 20px;
            display: grid;
            gap: 12px
        }

        .viagem {
            background: #fff;
            border: 1px solid var(--linha);
            border-radius: 16px;
            padding: 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 18px;
            align-items: center
        }

        .icone {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--rosa-100);
            color: var(--rosa-700);
            display: grid;
            place-items: center
        }

        .icone svg {
            width: 26px;
            height: 26px
        }

        .viagem h3 {
            font-size: 1.05rem;
            font-weight: 700
        }

        .meta {
            color: var(--suave);
            font-size: .9rem
        }

        .valor {
            text-align: right;
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap
        }

        .viagem h3 {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .viagem>div:nth-child(2),
        .destaque .linha>div:first-child {
            min-width: 0
        }

        .status {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: .8rem;
            font-weight: 500
        }

        .status.ok {
            background: #e4f5ec;
            color: var(--ok)
        }

        .status.cancelada {
            background: #fde6ec;
            color: var(--erro)
        }

        .acoes {
            grid-column: 2 / -1;
            display: flex;
            gap: 8px
        }

        .chip {
            font: inherit;
            font-size: .875rem;
            padding: 6px 14px;
            border: 1px solid var(--linha);
            border-radius: 999px;
            background: #fff;
            color: var(--rosa-700);
            cursor: pointer
        }

        .chip:hover {
            background: var(--rosa-100)
        }

        /* viagem em destaque, com mapa */
        .destaque {
            grid-template-columns: 260px 1fr;
            padding: 0;
            overflow: hidden
        }

        .mapa {
            background: var(--rosa-100);
            min-height: 200px;
            height: 100%
        }

        .mapa svg {
            width: 100%;
            height: 100%;
            display: block
        }

        .destaque .corpo {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .destaque .linha {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: start
        }

        .destaque .acoes {
            grid-column: auto;
            margin-top: auto;
            padding-top: 12px
        }

        .mais {
            display: block;
            margin: 28px auto 0
        }

        .mais.btn {
            background: var(--rosa-700);
            color: #fff
        }

        .mais.btn:hover {
            background: var(--rosa-900)
        }

        @media (max-width:640px) {
            .destaque {
                grid-template-columns: 1fr
            }

            .mapa {
                min-height: 160px
            }

            .viagem {
                grid-template-columns: auto 1fr
            }

            .valor {
                grid-column: 2;
                text-align: left
            }

            .topo {
                gap: 12px
            }

            nav a {
                padding: 8px 10px
            }
        }

        .vazio {
            background: #fff;
            border: 1px dashed var(--rosa-200);
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            color: var(--suave)
        }

        .vazio strong {
            display: block;
            color: var(--rosa-900);
            font-size: 1.1rem;
            margin-bottom: 4px
        }

        @media (max-width:760px) {

            nav,
            .idioma {
                display: none
            }

            .direita {
                margin-left: auto;
                gap: 14px
            }

            .menu {
                width: min(324px, calc(100vw - 32px))
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header>
        <div class="topo">
            <a class="logo" href="inicial.html"><img src="/site-de-corrida-wn-57-main/site-de-corrida-wn-57-main/site-wn-57-corrida-main/img/logo/logown57.png" alt="WN57"></a>

            <nav aria-label="Principal">
                <a href="/site-de-corrida-wn-57-main/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/inicial.html">Inicial</a>
            </nav>

            <div class="direita">
                <span class="idioma"><i class="fa-solid fa-globe"></i>PT-BR</span>
                <a href="#">Ajuda</a>

                <div class="perfil">
                    <button class="perfil-btn" id="perfilBtn" type="button" aria-haspopup="true" aria-expanded="false"
                        aria-controls="perfilMenu">
                        <span class="foto" id="fotoMini">K</span>
                        <span id="nomeMini">Conta</span>
                        <i class="fa-solid fa-caret-down seta"></i>
                    </button>

                    <div class="menu" id="perfilMenu">
                        <div class="menu-topo">
                            <div>
                                <h3 id="nomeCompleto">Usuário</h3>
                                <span class="nota-tag"><i class="fa-solid fa-star" style="font-size:.7rem"></i>
                                    5,00</span>
                            </div>
                            <div class="foto-grande" id="fotoGrande">K</div>
                        </div>

                        <div class="atalhos">
                            <a href="#"><i class="fa-solid fa-circle-xmark"></i>Ajuda</a>
                            <a href="#"><i class="fa-solid fa-wallet"></i>Carteira</a>
                            <a href="atividade.html" class="ativo"><i class="fa-solid fa-receipt"></i>Atividade</a>
                        </div>

                        <div class="lista-menu">
                            <a href="#"><i class="fa-solid fa-user"></i>Gerenciar conta</a>
                            <a href="solicitar.html"><i class="fa-solid fa-route"></i>Pedir corrida</a>
                            <a href="#"><i class="fa-solid fa-car"></i>Seja motorista</a>
                            <a href="#"><i class="fa-solid fa-comment"></i>Suporte</a>
                        </div>

                        <button class="sair" type="button" id="sair">Sair</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <h1>Atividade</h1>
        <p class="sub">Acompanhe suas viagens agendadas e anteriores.</p>

        <section class="agendadas" aria-labelledby="ag">
            <div>
                <h2 id="ag">Você não tem viagens agendadas</h2>
                <p>Reserve com antecedência e viaje com tranquilidade.</p>
            </div>
            <button class="btn" type="button">Reservar viagem</button>
        </section>

        <div class="barra">
            <h2 class="sec">Anteriores</h2>
            <div class="filtros">
                <select aria-label="Perfil">
                    <option>Pessoal</option>
                    <option>Trabalho</option>
                </select>
                <select id="periodo" aria-label="Período">
                    <option value="todas">Todas as viagens</option>
                    <option value="30">Últimos 30 dias</option>
                    <option value="365">Este ano</option>
                </select>
            </div>
        </div>

        <div class="lista" id="lista">
        </div>
    </main>

    <script>
        const KEY = "minhasViagens";
        const moto = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M5.5 16.5 9 9h4l3 7.5M13 9l2-3h3M9 9H6"/></svg>';
        const mapa = '<svg viewBox="0 0 260 220" preserveAspectRatio="xMidYMid slice"><rect width="260" height="220" fill="#fdeaf3"/><path d="M0 60H260M0 130H260M0 190H260M60 0V220M140 0V220M210 0V220" stroke="#fff" stroke-width="10"/><ellipse cx="45" cy="165" rx="40" ry="45" fill="#f3c6da"/><path d="M175 35V75H150V110H105V140H70V185" fill="none" stroke="#a81d63" stroke-width="5" stroke-linejoin="round"/><circle cx="175" cy="35" r="8" fill="#a81d63"/><circle cx="175" cy="35" r="3" fill="#fff"/><rect x="63" y="178" width="14" height="14" fill="#4a1230"/></svg>';

        const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const fmt = n => "R$ " + Number(n).toFixed(2).replace(".", ",");
        const dataHora = iso => { const d = new Date(iso); return d.toLocaleDateString("pt-BR", { day: "numeric", month: "short" }) + " • " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };

        function carregar() {
            try { return JSON.parse(localStorage.getItem(KEY) || "[]") } catch (e) { return [] }
        }

        function filtrar(lista) {
            const p = document.getElementById("periodo").value;
            if (p === "todas") return lista;
            const dias = p === "30" ? 30 : 365;
            const lim = Date.now() - dias * 86400000;
            return lista.filter(t => new Date(t.data).getTime() >= lim);
        }

        function card(t, destaque) {
            const canc = t.status === "cancelada";
            const status = `<span class="status ${canc ? "cancelada" : "ok"}">${canc ? "Cancelada" : "Concluída"}</span>`;
            if (destaque && !canc) {
                return `<article class="viagem destaque"><div class="mapa" aria-hidden="true">${mapa}</div><div class="corpo"><div class="linha"><div><h3 title="${esc(t.destino)}">${esc(t.destino)}</h3><p class="meta">${dataHora(t.data)}${t.pagamento ? " • " + esc(t.pagamento) : ""}</p>${status}</div><div class="valor">${fmt(t.valor)}</div></div><div class="acoes"><button class="chip" type="button">Ajuda</button><button class="chip" type="button">Informações</button></div></div></article>`;
            }
            return `<article class="viagem"><div class="icone" aria-hidden="true">${moto}</div><div><h3 title="${esc(t.destino)}">${esc(t.destino)}</h3><p class="meta">${dataHora(t.data)}${t.pagamento ? " • " + esc(t.pagamento) : ""}</p>${status}</div><div class="valor">${fmt(canc ? 0 : t.valor)}</div><div class="acoes"><button class="chip" type="button">Ajuda</button></div></article>`;
        }

        function render() {
            const el = document.getElementById("lista");
            const lista = filtrar(carregar()).sort((a, b) => new Date(b.data) - new Date(a.data));
            if (!lista.length) {
                el.innerHTML = '<div class="vazio"><strong>Nenhuma viagem ainda</strong>As corridas que você fizer vão aparecer aqui.</div>';
                return;
            }
            el.innerHTML = lista.map((t, i) => card(t, i === 0)).join("");
        }

        document.getElementById("periodo").addEventListener("change", render);
        window.addEventListener("storage", e => { if (e.key === KEY) render() }); // atualiza se outra aba salvar
        render();

        // ===== Perfil: dados vindos do cadastro.html =====
        (function () {
            // Lê um valor do localStorage (JSON ou texto)
            function ler(chave) {
                const bruto = localStorage.getItem(chave);
                if (bruto === null) return null;
                try { return JSON.parse(bruto) } catch (e) { return bruto }
            }

            const CHAVES_LISTA = ["usuarios", "users", "cadastros", "usuariosCadastrados", "listaUsuarios", "contas"];
            const CHAVES_UNICA = ["usuario", "dadosUsuario", "dadosCadastro", "cadastro", "user", "perfil"];

            function iguais(a, b) { return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase() }

            function acharUsuario() {
                const logado = ler("usuarioLogado");

                // 1) o login já guardou o cadastro inteiro
                if (logado && typeof logado === "object") return logado;

                // 2) o login guardou só e-mail / nome / id: procura na lista de cadastros
                if (logado) {
                    for (const chave of CHAVES_LISTA) {
                        const lista = ler(chave);
                        if (Array.isArray(lista)) {
                            const achou = lista.find(function (u) {
                                return u && typeof u === "object" && [u.email, u.login, u.usuario, u.cpf, u.id, u.nome].some(function (v) { return iguais(v, logado) });
                            });
                            if (achou) return achou;
                        }
                    }
                }

                // 3) o cadastro foi salvo como um único objeto
                for (const chave of CHAVES_UNICA) {
                    const u = ler(chave);
                    if (u && typeof u === "object" && !Array.isArray(u)) return u;
                }

                // 4) só existe um texto (provavelmente o nome)
                return typeof logado === "string" ? { nome: logado } : {};
            }

            const u = acharUsuario();
            console.log("Perfil carregado do cadastro:", u); // ajuda a conferir os nomes dos campos

            const primeiro = function () { for (const v of arguments) { if (v && String(v).trim()) return String(v).trim() } return "" };
            let nome = primeiro(u.nomeCompleto, u.nome_completo, u.fullName, u.nome, u.name, u.usuario);
            const sobrenome = primeiro(u.sobrenome, u.lastName, u.sobreNome);
            if (nome && sobrenome && !nome.toLowerCase().includes(sobrenome.toLowerCase())) nome += " " + sobrenome;
            nome = nome || "Minha conta";
            const foto = primeiro(u.foto, u.fotoPerfil, u.avatar, u.imagem, u.img);
            const inicial = nome.charAt(0).toUpperCase();

            document.getElementById("nomeCompleto").textContent = nome;
            document.getElementById("nomeMini").textContent = nome.split(" ")[0].toLowerCase();
            ["fotoMini", "fotoGrande"].forEach(function (id) {
                const el = document.getElementById(id);
                if (foto) { el.textContent = ""; const img = new Image(); img.src = foto; img.alt = ""; el.appendChild(img) }
                else el.textContent = inicial;
            });

            const btn = document.getElementById("perfilBtn"), menu = document.getElementById("perfilMenu");
            function alternar(ab) { menu.classList.toggle("aberto", ab); btn.setAttribute("aria-expanded", ab) }
            btn.addEventListener("click", function (e) { e.stopPropagation(); alternar(!menu.classList.contains("aberto")) });
            document.addEventListener("click", function (e) { if (!menu.contains(e.target)) alternar(false) });
            document.addEventListener("keydown", function (e) { if (e.key === "Escape") { alternar(false); btn.focus() } });
            document.getElementById("sair").addEventListener("click", function () {
                localStorage.removeItem("usuarioLogado");
                window.location.href = "login.html";
            });
        })();
    </script>
</body>

</html>
